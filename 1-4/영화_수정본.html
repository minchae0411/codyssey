<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 영화 티어리스트</title>
  <style>
    :root { --paper:#faf8f3; --ink:#242922; --muted:#5f685d; --line:#d9dad1; --green:#276453; --sage:#e3eee7; --peach:#f2e6dc; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:system-ui,-apple-system,sans-serif; line-height:1.6;  }
    main { width:min(100% - 32px,860px); margin:32px auto 48px; }
    header { display:flex; align-items:start; justify-content:space-between; gap:20px; flex-wrap:wrap; }
    h1 { margin:0; font-size:clamp(26px,5vw,34px); line-height:1.25; letter-spacing:-.03em; }
    .sub { margin:10px 0 0; color:var(--muted); max-width:46ch; }
    .tools { display:flex; flex-wrap:wrap; gap:8px; width:100%; margin-top:20px; }
    .tools input { min-width:0; flex:1 1 160px; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font:inherit; }
    button { font:inherit; cursor:pointer; }
    .tools button { padding:10px 15px; border:1px solid var(--green); border-radius:12px; font-weight:700; background:var(--green); color:#fff; }
    .tools .reset { color:var(--green); background:#fff; }
    #message { min-height:26px; margin:14px 0; font-size:14px; color:var(--muted); }
    .tiers { display:grid; gap:10px; }
    .row { display:flex; min-height:90px; background:#fff; border:1.5px solid var(--line); border-radius:14px; overflow:hidden; }
    .row.over { outline:3px solid var(--green); outline-offset:1px; }
    .label { width:64px; flex-shrink:0; border:0; color:white; font-size:26px; font-weight:800; padding:12px 4px; }
    .S .label { background:#a55239; } .A .label { background:#b4763e; } .B .label { background:#276453; } .C .label { background:#67725d; }
    .drop { flex:1; min-width:0; display:flex; flex-wrap:wrap; align-content:flex-start; gap:9px; padding:12px; min-height:88px; }
    .pool { margin-top:22px; }
    .pool-head { margin:0 0 8px; border:0; padding:0; background:transparent; color:var(--muted); font-size:17px; font-weight:700; text-align:left; }
    #pool { border:1.5px dashed var(--line); border-radius:14px; background:#fff; }
    .wrap { width:124px; border:1px solid transparent; border-radius:10px; display:flex; flex-direction:column; overflow:hidden; cursor:grab; }
    .wrap.selected { outline:3px solid var(--green); outline-offset:2px; }
    .card { display:block; width:100%; flex:1; min-height:62px; padding:8px; border:0; background:transparent; text-align:left; font-size:14px; font-weight:650; line-height:1.35; overflow-wrap:anywhere; color:var(--ink); cursor:inherit; }
    .poster { display:block; width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:6px; margin-bottom:6px; background:#ddd; }
    .genres { display:block; margin-top:3px; font-size:12px; font-weight:600; color:var(--muted); }
    .count { display:block; font-size:14px; font-weight:600; }
    .edit-btn { width:calc(100% - 16px); margin:0 8px 8px; padding:4px 0; border:1px solid rgba(36,41,34,.25); border-radius:8px; background:rgba(255,255,255,.7); color:var(--ink); font-size:13px; font-weight:700; }
    .note { font-size:13px; color:var(--muted); margin-top:18px; }
    :focus-visible { outline:3px solid #ba613a; outline-offset:3px; }
    dialog { width:min(92vw,400px); max-height:92vh; overflow:auto; border:1.5px solid var(--line); border-radius:16px; padding:20px; color:var(--ink); background:#fff; }
    dialog::backdrop { background:rgba(36,41,34,.45); }
    dialog h2 { margin:0 0 12px; font-size:20px; overflow-wrap:anywhere; }
    .field { margin-top:14px; }
    .field > span { display:block; margin-bottom:6px; font-size:14px; font-weight:700; }
    .paste { display:flex; align-items:center; justify-content:center; min-height:150px; border:2px dashed var(--line); border-radius:12px; background:var(--paper); color:var(--muted); font-size:14px; text-align:center; padding:8px; overflow:hidden; }
    .paste img { max-width:100%; max-height:240px; border-radius:8px; }
    .poster-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .poster-actions label, .poster-actions button, .dialog-actions button { padding:8px 12px; border:1px solid var(--green); border-radius:10px; background:#fff; color:var(--green); font-size:14px; font-weight:700; cursor:pointer; }
    .genre-list { display:flex; flex-wrap:wrap; gap:6px; }
    .genre-list label { display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border:1px solid var(--line); border-radius:999px; font-size:14px; cursor:pointer; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
    .dialog-actions .save { background:var(--green); color:#fff; }
    #edit-msg { min-height:22px; margin:10px 0 0; font-size:13px; color:#a55239; }
    @media(max-width:420px) { .label { width:48px; } .wrap { width:112px; } .drop { padding:10px; gap:8px; } }
  </style>
</head>
<body>
  <main>
    <header><div><h1>내 영화 티어리스트</h1><p class="sub">영화를 선택한 뒤 옮길 등급 글자를 눌러 주세요. 카드를 끌어서 놓아도 됩니다.</p></div></header>
    <form class="tools" id="add-form">
      <input id="title" aria-label="영화 제목" placeholder="영화 제목 추가" maxlength="80">
      <button type="submit">추가</button>
      <button type="button" class="reset" id="reset">처음으로</button>
    </form>
    <p id="message" role="status">영화를 선택해 S·A·B·C로 나누어 보세요.</p>
    <section class="tiers" id="tiers" aria-label="영화 등급"></section>
    <section class="pool" aria-label="아직 안 정한 영화">
      <button class="pool-head" id="pool-label" type="button" aria-label="미분류로 옮기기">아직 안 정한 영화</button>
      <div class="drop" id="pool" data-tier="pool"></div>
    </section>
    <p class="note">같은 브라우저에서 이 파일을 다시 열면 정리한 목록이 남습니다. 다른 사람에게 파일을 보내도 내 입력 내역까지 전달되지는 않습니다.</p>
  </main>

  <dialog id="edit-dialog" aria-labelledby="edit-title">
    <h2 id="edit-title">영화 수정</h2>
    <div class="field">
      <span>포스터</span>
      <div class="paste" id="paste-zone" tabindex="0" aria-label="포스터 붙여넣기 칸">복사한 이미지를 여기에 붙여넣으세요 (Ctrl+V / ⌘+V)</div>
      <div class="poster-actions">
        <label>파일에서 고르기<input type="file" id="poster-file" accept="image/*" hidden></label>
        <button type="button" id="poster-remove">포스터 지우기</button>
      </div>
    </div>
    <div class="field">
      <span>장르 (여러 개 선택 가능)</span>
      <div class="genre-list" id="genre-list"></div>
    </div>
    <p id="edit-msg" role="status"></p>
    <div class="dialog-actions">
      <button type="button" id="edit-cancel">취소</button>
      <button type="button" class="save" id="edit-save">저장</button>
    </div>
  </dialog>

  <script>
    const KEY = "codyssey-activity-04-v2";
    const LEVELS = ['S', 'A', 'B', 'C', 'pool'];
    const TITLES = ["기생충","인터스텔라","라라랜드","센과 치히로의 행방불명","어벤져스: 엔드게임","범죄도시","타이타닉","토이 스토리"];
    const COLORS = ["#f2e6dc","#e3eee7","#ede7f6","#fcefd9","#e2ecf4","#f6e3e3"];
    const GENRES = ["드라마","액션","SF","로맨스","애니메이션","코미디","스릴러","범죄","판타지","공포","다큐멘터리","기타"];
    const initial = () => ({ nextId: TITLES.length + 1, items: TITLES.map((title,index) => ({ id: 'm' + (index + 1), title, tier: 'pool' })) });
    let state = initial();
    let selected = null;
    try {
      const stored = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (stored && Number.isSafeInteger(stored.nextId) && Array.isArray(stored.items)
          && stored.items.every(item => typeof item.id === 'string' && typeof item.title === 'string' && LEVELS.includes(item.tier))) state = stored;
    } catch {}
    function showMessage(message) { document.querySelector('#message').textContent = message; }
    function trySave() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); return true; } catch { return false; }
    }
    function save() {
      if (!trySave()) showMessage('이 브라우저에서는 저장하지 못했어요. 현재 화면에서 확인한 내용과 다시 열어 확인한 내용을 구분해 주세요.');
    }
    function move(id,tier) {
      const item = state.items.find(item => item.id === id);
      if (!item || !LEVELS.includes(tier)) return;
      item.tier = tier; selected = null; save(); render();
      showMessage((item.title || '영화') + '를 옮겼어요.');
    }
    function genresOf(item) {
      return Array.isArray(item.genres) ? item.genres.filter(g => GENRES.includes(g)) : [];
    }
    function card(item,index) {
      const wrap = document.createElement('div');
      wrap.className = 'wrap' + (selected === item.id ? ' selected' : ''); wrap.draggable = true; wrap.dataset.id = item.id;
      wrap.style.backgroundColor = COLORS[index % COLORS.length];
      wrap.addEventListener('dragstart',event => { event.dataTransfer.setData('text/plain',item.id); });

      const element = document.createElement('button');
      element.type = 'button'; element.className = 'card';
      if (typeof item.poster === 'string' && item.poster.startsWith('data:image/')) {
        const img = document.createElement('img'); img.className = 'poster'; img.src = item.poster; img.alt = (item.title || '영화') + ' 포스터'; img.draggable = false;
        element.append(img);
      }
      element.append(document.createTextNode(item.title || ' '));
      const genres = genresOf(item);
      if (genres.length) { const g = document.createElement('span'); g.className = 'genres'; g.textContent = genres.join(' · '); element.append(g); }
      element.dataset.id = item.id;
      element.setAttribute('aria-label',(item.title || '영화 카드') + (genres.length ? ', ' + genres.join(', ') : ''));
      element.setAttribute('aria-pressed',String(selected === item.id));
      element.addEventListener('click',event => {
        event.stopPropagation(); selected = selected === item.id ? null : item.id; render();
        showMessage(selected ? (item.title || '영화') + '를 선택했어요.' : '선택을 해제했어요.');
      });

      const edit = document.createElement('button');
      edit.type = 'button'; edit.className = 'edit-btn'; edit.textContent = '수정';
      edit.setAttribute('aria-label',(item.title || '영화') + ' 수정');
      edit.addEventListener('click',event => { event.stopPropagation(); openEdit(item.id); });

      wrap.append(element,edit);
      return wrap;
    }
    function wireDrop(element,tier) {
      element.addEventListener('dragover',event => { event.preventDefault(); element.closest('.row')?.classList.add('over'); });
      element.addEventListener('dragleave',() => element.closest('.row')?.classList.remove('over'));
      element.addEventListener('drop',event => { event.preventDefault(); move(event.dataTransfer.getData('text/plain'),tier); });
      element.onclick = () => { if (selected) move(selected,tier); };
    }
    function render() {
      const tiers = document.querySelector('#tiers'); tiers.replaceChildren();
      for (const tier of LEVELS.filter(value => value !== 'pool')) {
        const row = document.createElement('div'); row.className = 'row ' + tier;
        const label = document.createElement('button'); label.type = 'button'; label.className = 'label';
        label.textContent = tier; label.setAttribute('aria-label',tier + '등급으로 옮기기');
        label.addEventListener('click',() => { if (selected) move(selected,tier); else showMessage('먼저 영화 카드를 선택해 주세요.'); });
        
        const drop = document.createElement('div'); drop.className = 'drop'; drop.dataset.tier = tier;
        state.items.forEach((item,index) => { if (item.tier === tier) drop.append(card(item,index)); });
        wireDrop(drop,tier); row.append(label,drop); tiers.append(row);
      }
      const pool = document.querySelector('#pool'); pool.replaceChildren();
      state.items.forEach((item,index) => { if (item.tier === 'pool') pool.append(card(item,index)); });
      
    }

    /* ---------- 수정 창 (포스터 · 장르) ---------- */
    const dialog = document.querySelector('#edit-dialog');
    const pasteZone = document.querySelector('#paste-zone');
    const editMsg = document.querySelector('#edit-msg');
    const genreList = document.querySelector('#genre-list');
    let editingId = null, draftPoster = '';
    for (const genre of GENRES) {
      const label = document.createElement('label');
      const box = document.createElement('input'); box.type = 'checkbox'; box.value = genre;
      label.append(box, document.createTextNode(genre)); genreList.append(label);
    }
    function showPreview() {
      pasteZone.replaceChildren();
      if (draftPoster) { const img = document.createElement('img'); img.src = draftPoster; img.alt = '포스터 미리보기'; pasteZone.append(img); }
      else pasteZone.textContent = '복사한 이미지를 여기에 붙여넣으세요 (Ctrl+V / ⌘+V)';
    }
    function openEdit(id) {
      const item = state.items.find(item => item.id === id); if (!item) return;
      editingId = id; draftPoster = (typeof item.poster === 'string' && item.poster.startsWith('data:image/')) ? item.poster : '';
      document.querySelector('#edit-title').textContent = (item.title || '영화') + ' 수정';
      const current = genresOf(item);
      genreList.querySelectorAll('input').forEach(box => { box.checked = current.includes(box.value); });
      editMsg.textContent = ''; showPreview();
      if (typeof dialog.showModal === 'function') dialog.showModal(); else dialog.setAttribute('open','');
      pasteZone.focus();
    }
    function closeEdit() { editingId = null; if (typeof dialog.close === 'function') dialog.close(); else dialog.removeAttribute('open'); }
    function loadPoster(file) {
      if (!file || !file.type.startsWith('image/')) { editMsg.textContent = '이미지 파일만 넣을 수 있어요.'; return; }
      const reader = new FileReader();
      reader.onerror = () => { editMsg.textContent = '이미지를 읽지 못했어요.'; };
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => { editMsg.textContent = '이 이미지는 사용할 수 없어요.'; };
        img.onload = () => {
          const scale = Math.min(1, 400 / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale)); canvas.height = Math.max(1, Math.round(img.height * scale));
          const context = canvas.getContext('2d'); context.fillStyle = '#fff'; context.fillRect(0,0,canvas.width,canvas.height);
          context.drawImage(img,0,0,canvas.width,canvas.height);
          draftPoster = canvas.toDataURL('image/jpeg',0.8); editMsg.textContent = ''; showPreview();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }
    dialog.addEventListener('paste',event => {
      const files = [...(event.clipboardData?.items || [])].filter(entry => entry.type.startsWith('image/')).map(entry => entry.getAsFile());
      if (files.length) { event.preventDefault(); loadPoster(files[0]); }
      else editMsg.textContent = '클립보드에 이미지가 없어요. 이미지를 먼저 복사해 주세요.';
    });
    document.querySelector('#poster-file').addEventListener('change',event => { loadPoster(event.target.files[0]); event.target.value = ''; });
    document.querySelector('#poster-remove').addEventListener('click',() => { draftPoster = ''; editMsg.textContent = ''; showPreview(); });
    document.querySelector('#edit-cancel').addEventListener('click',closeEdit);
    dialog.addEventListener('close',() => { editingId = null; });
    document.querySelector('#edit-save').addEventListener('click',() => {
      const item = state.items.find(item => item.id === editingId); if (!item) { closeEdit(); return; }
      const before = { poster:item.poster, genres:item.genres };
      if (draftPoster) item.poster = draftPoster; else delete item.poster;
      const chosen = [...genreList.querySelectorAll('input:checked')].map(box => box.value);
      if (chosen.length) item.genres = chosen; else delete item.genres;
      if (!trySave()) {
        if (before.poster === undefined) delete item.poster; else item.poster = before.poster;
        if (before.genres === undefined) delete item.genres; else item.genres = before.genres;
        editMsg.textContent = '저장 공간이 부족해서 저장하지 못했어요. 더 작은 이미지를 사용해 주세요.'; return;
      }
      const name = item.title || '영화'; closeEdit(); render(); showMessage(name + ' 정보를 저장했어요.');
    });

    wireDrop(document.querySelector('#pool'),'pool');
    document.querySelector('#pool-label').addEventListener('click',() => { if (selected) move(selected,'pool'); else showMessage('먼저 영화 카드를 선택해 주세요.'); });
    document.querySelector('#add-form').addEventListener('submit',event => {
      event.preventDefault(); const input = document.querySelector('#title'); const title = input.value.trim();
      if (!title) { showMessage('영화 제목을 입력해 주세요.'); input.focus(); return; }
      if (state.items.some(item => item.title === title)) { showMessage('이미 있는 영화 제목이에요. 다른 제목을 넣어 주세요.'); return; }
      state.items.push({ id: 'm' + state.nextId++, title, tier: 'pool' });
      save(); render(); input.value = ''; showMessage('영화를 추가했어요.'); input.focus();
    });
    document.querySelector('#reset').addEventListener('click',() => {
      state = initial(); selected = null; document.querySelector('#title').value = ''; save(); render(); showMessage('처음 목록으로 돌아왔어요.');
    });
    render();
  </script>
</body>
</html>
